spring:
  application:
    name: realtime-matching
  threads:
    virtual:
      enabled: true          # 04 2.1 — SSE 연결당 스레드 비용을 낮춘다
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # 04 5장 — 계측은 0단계부터
  metrics:
    tags:
      instance: ${MATCHING_INSTANCE_ID:app-1}

matching:
  instance-id: ${MATCHING_INSTANCE_ID:app-1}
  initial-delay: 1s
  cycle-interval: 1s          # 02 1.4 — 초기값 1초. 성립률 곡선(02 6.3)과 함께 조정한다
  scan-window: 300
  max-offers-per-cycle: 20
  search-budget: 20000
  accept-window: 30s          # 01 5.2 — 수락 제한시간. 제안 생성 시각 기준(02 3.1)
  combo-suppression: 10m      # 01 5.4
  min-max-wait: 1m
  max-max-wait: 60m
  heartbeat: 15s
  tier-rule:                  # 01 3.5 — 코드에 고정하지 않는다. 순서값은 디비전 단위(0 = 아이언 IV)
    solo-duo-blocked-from-order: 28   # 마스터 이상 (01 3.6)
    solo-duo-bands:
      - up-to-order: 11       # ~ 골드 IV 미만: 낮은 구간은 여러 단계까지 허용
        spread: 8
      - up-to-order: 23       # ~ 다이아 IV 미만: 한 티어 위아래
        spread: 4
      - up-to-order: 27       # 다이아 구간: 디비전 단위
        spread: 2

logging:
  level:
    com.port051.queuemate.matching: DEBUG
