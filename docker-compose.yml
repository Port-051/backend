# 02 1.2 — 모든 측정은 인스턴스 2대 이상에서 한다.
# 1대로는 좌석 경합도 인스턴스 간 제안 전파도 재현되지 않는다.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # 02 1.3 — 불변식 검증의 권위. 판정 게이트가 여기서 검출 질의를 돌린다.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queuemate
      POSTGRES_USER: queuemate
      POSTGRES_PASSWORD: queuemate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuemate"]
      interval: 2s
      timeout: 2s
      retries: 15

  app-1:
    build: .
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      MATCHING_INSTANCE_ID: app-1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  app-2:
    build: .
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      MATCHING_INSTANCE_ID: app-2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-1
      - app-2
