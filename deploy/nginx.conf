# 02 1.1 — 요청을 두 인스턴스에 나누는 주체가 없으면 경합이 왜 생기는지 설명되지 않는다.
upstream matching {
    least_conn;
    server app-1:8080;
    server app-2:8080;
}

server {
    listen 80;

    # SSE — 한 연결은 한 인스턴스에 고정된다. 그래서 제안 전파에 Pub/Sub이 필요하다.
    location /api/events {
        proxy_pass http://matching;
        proxy_http_version 1.1;
        proxy_buffering off;          # 버퍼링이 켜져 있으면 이벤트가 묶여 나가 전달 지연 측정이 망가진다
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://matching;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Upstream $upstream_addr;
    }
}
