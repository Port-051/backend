# 02 1.1이 구성도에 LB를 그려둔 이유를 그대로 구현한다.
#
# 핵심은 두 가지다.
#   1) /api/match-requests 같은 일반 요청은 두 인스턴스에 나눠 보낸다 → 경합이 생긴다
#   2) /api/events(SSE)는 연결이 한 인스턴스에 고정된다 → 제안 전파에 Pub/Sub이 필요해진다
#
# 2번을 sticky로 만들지 않는다. 붙는 순간 어느 인스턴스에 붙을지는 nginx가 정하고,
# 같은 사용자의 다음 API 요청은 다른 인스턴스로 갈 수 있다. 그 어긋남이 이 스파이크의 재료다.

events {
  worker_connections 4096;
}

http {
  upstream apps {
    server app-1:8080;
    server app-2:8080;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://apps;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE는 버퍼링을 끄지 않으면 이벤트가 nginx에 고여 있다가 뭉쳐서 나간다.
    # 그러면 제안 전달 지연 p95(02 6.2)가 서버가 아니라 프록시 설정을 재게 된다.
    location /api/events {
      proxy_pass http://apps;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding off;
    }
  }
}
