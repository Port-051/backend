spring:
  application:
    name: queuemate-matching
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

queuemate:
  matching:
    # 최대 대기시간. 01 3.1은 사용자가 고르는 값으로 정의하지만 계약(05 2장)의 필드에 없어
    # 이 단계에서는 서버가 하나로 정한다.
    max-wait: 5m
    # 배정 중 표시를 유지하는 시간. 파티 하나를 짜는 데 걸리는 시간보다 길고,
    # 인스턴스가 죽었을 때 요청이 묶여 있는 시간보다는 짧아야 한다.
    claim-ttl: 3s
    # 틱 주기. 02 1.4가 "측정으로 정하되 초기값은 1초"로 둔 값이다.
    # 짧으면 빈 조회가 늘고, 길면 대기 시간이 늘어난다.
    tick: 1s
    # SSE 연결 유지 시간. 최대 대기시간보다 길어야 만료 소식을 받을 연결이 살아 있다.
    sse-timeout: 6m
