# 테스트 설정. src/main 쪽 application.yml을 가린다.
#
# 배경 스케줄러를 끄는 것이 핵심이다. 켜져 있으면 1초마다 도는 매칭 루프가
# 테스트가 준비한 대기 명단을 확인하기 전에 먹어 버린다.
# 루프를 직접 확인하는 테스트는 MatchingTick.runOnce()를 원하는 시점에 부른다.
spring:
  application:
    name: queuemate-matching-test
  threads:
    virtual:
      enabled: true

queuemate:
  matching:
    scheduled: false
    max-wait: 5m
    claim-ttl: 3s
    tick: 1s
    # 테스트가 6분을 기다릴 수 없다. 연결을 닫지 않고 끝나는 테스트가 있어도 곧 풀린다.
    sse-timeout: 5s
    # 요청 메모의 안전망. 취소·만료·확정 중간에 죽어 남은 메모를 스스로 지운다.
    # 최대 대기시간보다 길어야 한다. 짧으면 대기 중인 요청의 조건이 먼저 사라진다.
    request-ttl: 6m
